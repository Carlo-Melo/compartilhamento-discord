# T-03: renderizado por Initialize-CaptureProof.ps1 para uma LAN privada escolhida.
# Nao usar diretamente e nao substituir a configuracao loopback da T-02.
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7891
  udp_port: 7892
  use_external_ip: false
  node_ip: __LAN_IP__
  enable_loopback_candidate: false
  stun_servers: []
room:
  auto_create: false
  max_participants: 10
  empty_timeout: 300
  departure_timeout: 20
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
turn:
  enabled: false
logging:
  level: warn
  pion_level: error
