name: compartilhamento-discord-livekit-dev

services:
  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    command: ["--config", "/etc/livekit/livekit.local.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY em .env.livekit}: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET em .env.livekit}"
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ../livekit/livekit.local.yaml:/etc/livekit/livekit.local.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
